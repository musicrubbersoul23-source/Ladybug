<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ladybug - A Forever Memory</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap">
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        
        @keyframes float-bird {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { traynsform: translateY(-40px) translateX(20px) rotate(5deg); }
        }
        @keyframes float-slow {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        @keyframes letter-reveal {
            0% { transform: translateY(100px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-float-bird { animation: float-bird 10s ease-in-out infinite; }
        .animate-float-slow { animation: float-slow linear infinite; }
        .animate-letter-reveal { animation: letter-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-spin-slow { animation: spin-slow 12s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom SVG Icons
        const Heart = ({ size = 24, fill = "none", className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        );
        const Mail = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        );
        const HomeIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        );
        const Bird = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 7c.5 0 1 2.5 1 2.5s2.5 0 2.5 1-2.5 1-2.5 1 0 2.5-1 2.5-1-2.5-1-2.5-2.5 0-2.5-1 2.5-1 2.5-1 0-2.5 1-2.5z"/><path d="M7 7c.5 0 1 2.5 1 2.5s2.5 0 2.5 1-2.5 1-2.5 1 0 2.5-1 2.5-1-2.5-1-2.5-2.5 0-2.5-1 2.5-1 2.5-1 0-2.5 1-2.5z"/></svg>
        );
        const Dog = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 5.172C10 3.42 11.42 2 13.172 2h1.656C16.58 2 18 3.42 18 5.172v.656C18 7.58 16.58 9 14.828 9h-1.656C11.42 9 10 7.58 10 5.828v-.656Z"/><path d="M4.427 19.536a2 2 0 0 0 2.828 0l2.172-2.172"/><path d="M14.828 9c-.405 0-.796.076-1.156.216l-5.136 5.136a2 2 0 0 1-2.828 0l-1.414-1.414a2 2 0 0 1 0-2.828l5.136-5.136"/><path d="M20 9v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg>
        );

        const App = () => {
            const [page, setPage] = useState('landing');
            const [isHovered, setIsHovered] = useState(false);

            const particles = useMemo(() => 
                Array.from({ length: 20 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100 + '%',
                    top: Math.random() * 100 + '%',
                    size: Math.random() * 15 + 5,
                    delay: Math.random() * 5 + 's',
                    duration: Math.random() * 10 + 10 + 's'
                }))
            , []);

            const ScenicBackground = () => (
                <div className="absolute inset-0 z-0 overflow-hidden pointer-events-none">
                    <div className="absolute inset-0 bg-gradient-to-b from-[#ffdfd3] via-[#fff5f5] to-white" />
                    {particles.map(p => (
                        <div key={p.id} className="absolute rounded-full bg-[#d14d72] animate-float-slow"
                             style={{ left: p.left, top: p.top, width: p.size, height: p.size, animationDelay: p.delay, animationDuration: p.duration }} />
                    ))}
                    <svg viewBox="0 0 800 600" className="w-full h-full opacity-40" preserveAspectRatio="xMidYMid slice">
                        <path d="M-100,600 L200,150 L500,600 Z" fill="#e35d5d" opacity="0.1" />
                        <path d="M150,600 L450,100 L750,600 Z" fill="#d14d72" opacity="0.15" />
                        <path d="M400,600 L700,200 L1000,600 Z" fill="#e35d5d" opacity="0.1" />
                        <path d="M-100,600 C150,450 450,450 900,600 Z" fill="#ffdfd3" opacity="0.5" />
                    </svg>
                </div>
            );

            const LandingPage = () => (
                <div className="relative min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden">
                    <ScenicBackground />
                    <div className="absolute top-[20%] left-[10%] animate-float-bird text-[#d14d72] opacity-30"><Bird size={48} /></div>
                    
                    <div className="z-105 text-center flex flex-col items-center">
                        <div className="relative mb-16 transform transition-transform duration-700 hover:scale-110">
                            <div className="bg-white/60 p-12 rounded-full backdrop-blur-md border border-white/80 shadow-2xl relative">
                                <HomeIcon className="text-[#d14d72] w-24 h-24" />
                                <div className="absolute -bottom-2 -right-2 bg-white p-3 rounded-full shadow-lg border border-[#ffdfd3]">
                                    <Dog className="text-[#ff9a9e]" size={32} />
                                </div>
                                <Heart size={20} fill="#d14d72" className="absolute -top-4 left-0 text-[#d14d72] animate-bounce opacity-40" />
                            </div>
                        </div>

                        <h1 className="text-7xl md:text-9xl font-serif text-[#d14d72] mb-16">
                            For <span className="italic text-[#ff9a9e]">Ladybug</span>
                        </h1>

                        <button 
                            onClick={() => setPage('letter')}
                            onMouseEnter={() => setIsHovered(true)}
                            onMouseLeave={() => setIsHovered(false)}
                            className="group relative bg-[#d14d72] hover:bg-[#b03a5b] text-white px-16 py-8 rounded-full text-3xl font-serif italic transition-all duration-500 transform hover:scale-105 shadow-2xl flex items-center gap-6"
                        >
                            <span>Open Memory</span>
                            {isHovered ? <Heart size={32} fill="currentColor" /> : <Mail size={32} />}
                        </button>
                    </div>
                </div>
            );

            const LetterPage = () => (
                <div className="min-h-screen bg-[#d14d72] flex items-center justify-center p-4 md:p-8">
                    <button onClick={() => setPage('landing')} className="fixed top-8 left-8 text-white/70 hover:text-white flex items-center gap-2 z-50 bg-black/10 px-6 py-3 rounded-full backdrop-blur-md">
                        <Heart size={18} /> Back
                    </button>

                    <div className="relative w-full max-w-2xl animate-letter-reveal">
                        <div className="bg-[#fffcf9] rounded-3xl shadow-2xl overflow-hidden border-[16px] border-[#ffdfd3] p-8 md:p-16 font-serif text-[#3d3d3d] space-y-8">
                            <h2 className="text-4xl md:text-5xl text-[#d14d72] italic font-semibold">Dear Raspberry,</h2>
                            <p className="text-2xl md:text-3xl">I would like share love and peace with you my sweet love. I'm fluid, flow where the slope is...</p>
                            <p className="text-2xl md:text-3xl">You are awesome, you are beautiful like a <span className="text-[#d14d72] font-bold underline decoration-[#ff9a9e] underline-offset-8">ladybug</span>...</p>
                            <div className="bg-[#fff5f5] p-8 rounded-3xl border-l-[12px] border-[#d14d72] italic text-xl md:text-2xl text-slate-700">"I'm sorry Babu, you get hurt from my behaviour. I improve and try will not to make it again."</div>
                            <p className="text-2xl md:text-3xl">I want to hold your hand and being with you, cuddling with you, exploring life with you, live with you...</p>
                            <div className="text-center py-10 bg-gradient-to-r from-transparent via-[#ffdfd3]/20 to-transparent rounded-full">
                                <div className="text-6xl mb-2 animate-bounce">🌺 જાસૂદ 🌺</div>
                                <p className="text-[#d14d72] italic text-xl">Flower for my little princess</p>
                            </div>
                            <p className="text-2xl md:text-3xl font-medium">Thank you for your love 💕 😘</p>
                            <div className="pt-10 border-t-2 border-[#ffdfd3]">
                                <p className="text-4xl text-[#d14d72] italic">Loving Cream</p>
                                <p className="text-orange-400 mt-2 text-2xl">🩷🧡</p>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return page === 'landing' ? <LandingPage /> : <LetterPage />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
